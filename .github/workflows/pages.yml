name: Publish IC Atlas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run check:models
      - run: npm run check:catalog
      - name: Resolve Pages base path
        id: base
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          name="${REPOSITORY#*/}"
          if [[ "$name" == *.github.io ]]; then
            echo 'path=' >> "$GITHUB_OUTPUT"
          else
            echo "path=/$name" >> "$GITHUB_OUTPUT"
          fi
      - name: Build static workbench
        run: npm run build:pages
        env:
          IC_ATLAS_BASE_PATH: ${{ steps.base.outputs.path }}
      - name: Validate static asset paths
        run: npm run check:pages
        env:
          IC_ATLAS_BASE_PATH: ${{ steps.base.outputs.path }}
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist/pages

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
